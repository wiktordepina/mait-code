# Dependency update PRs. Each one runs the full CI (tests, coverage gate,
# pip-audit), so a bad bump fails before review.
#
# Weekly on Monday, alongside the scheduled CI run. Minor and patch bumps are
# grouped into one PR per ecosystem; majors stay separate so a breaking change
# never hides inside a bundle. The cooldown holds back versions published in
# the last week, giving a compromised release time to be caught and yanked;
# security updates aren't subject to it.
#
# The mod's pinned Claude Code version (CLAUDE_CODE_VERSION in ci.yml) is a
# deliberate manual bump and isn't tracked here.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci(deps)"
